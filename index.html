<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Práctica JS</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet">

    <link rel="stylesheet" href="css/styles.css"> 

    <link rel="icon" href="img/golshi.ico" type="image/x-icon">    
</head>
<body>

    <header>
        <nav class="navbar navbar-expand-lg navbar-dark bg-dark fixed-top">
            <div class="container-fluid">
                <a class="navbar-brand" href="#">Navbar</a>
                <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav">
                    <span class="navbar-toggler-icon"></span>
                </button>
                <div class="collapse navbar-collapse" id="navbarNav">
                    <ul class="navbar-nav">
                        <li class="nav-item"><a class="nav-link active" href="#inicio">Inicio</a></li>
                        <li class="nav-item"><a class="nav-link" href="#valores_resultantes">Valores Resultantes</a></li>
                        <li class="nav-item"><a class="nav-link" href="#calculadora">Calculadora</a></li>
                        <li class="nav-item"><a class="nav-link" href="#lista">Lista</a></li>
                        <li class="nav-item"><a class="nav-link" href="#cambio">Cambios de Estilos</a></li>
                    </ul>
                </div>
            </div>
        </nav>
    </header>

    <main>
        <!-- SECCIÓN A: Datos -->
        <div class="mt-20 m-10 text-light text-center" id="valores_resultantes">
            <h1>Valores Resultantes del ejercicio</h1>
            <button class="btn btn-primary mt-3" onclick="desplegardatos1()">Ver datos de Luis</button>   
            <p id="resultados" class="mt-3 p-3 text-dark bg-info rounded" style="display: none;"></p>
        </div>

        <!-- SECCIÓN B: Calculadora -->
        <div class="m-10 text-light" id="calculadora">
            <h1 class="text-center">Calculadora de promedio</h1>
            <form onsubmit="calcularpromedio(event)" class="text-center">
                <input type="number" id="parcial1" placeholder="Parcial 1" required class="form-control mb-2 w-50 mx-auto">
                <input type="number" id="parcial2" placeholder="Parcial 2" required class="form-control mb-2 w-50 mx-auto">
                <input type="number" id="parcial3" placeholder="Parcial 3" required class="form-control mb-2 w-50 mx-auto">
                <button type="submit" class="btn btn-success mt-2">Calcular</button>
            </form>
            <h3 id="resultadopromedio" class="text-center mt-3"></h3>
        </div>
        
        <!-- SECCIÓN C: Lista -->
        <div class="m-10 text-light" id="lista">
            <h1 class="text-center">Lista dinámica</h1>
            <div class="text-center">
                <input type="text" placeholder="Ingrese su texto" id="inputtext" class="form-control mb-2 w-50 mx-auto">
                <button class="btn btn-primary" onclick="addElement()">Agregar elemento</button>
                <button class="btn btn-danger" onclick="cleanElement()">Eliminar elementos</button>
            </div>
            <ul id="listadinamica" class="mt-3 list-group w-50 mx-auto"></ul>
        </div>   

        <!-- SECCIÓN D: Estilos -->
        <div class="m-10 text-light text-center p-4 rounded" id="cambio">
            <h1>Cambios de estilos</h1>
            <p>Selecciona un color para cambiar el fondo:</p>
            
            <!-- Botones con colores directos de la paleta -->
            <button class="btn mt-2 text-light" onclick="cambbg1()" style="background-color: #fa4652; border-color: #fa4652;">Fondo Rojo</button>
            <button class="btn mt-2 text-dark" onclick="cambbg2()" style="background-color: #ecd181; border-color: #ecd181;">Fondo Dorado</button>
            <button class="btn mt-2 text-light" onclick="cambbg3()" style="background-color: #5f3c3a; border-color: #5f3c3a;">Fondo Café</button>
            
            <button class="btn btn-secondary mt-2" onclick="ogbg()">Regresar al original</button>
        </div>
    </main>

    <audio id="musica-fondo" loop>
        <source src="audio/linganguligulislowed.mp3" type="audio/mp3">
    </audio>    

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"></script>
    
    <!-- AQUÍ VINCULAMOS TU JS (Asegúrate de que el nombre del archivo sea script.js) -->
    <script src="js/script.js"></script>
</body>
</html>
